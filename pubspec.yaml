name: ditto_gps
description: A sleek presence and manually entered GPS sharing app powered by Ditto.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ditto_live: ^5.0.2
  google_fonts: ^6.2.1
  http: ^1.5.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

